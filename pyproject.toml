[project]
name = "aws-cost-advisor"
version = "0.1.0"
description = "AWS Cost Optimization Advisor (Manager Agent) using AWS MCP, LangGraph, and Groq"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "flask>=3.0.0",
]


